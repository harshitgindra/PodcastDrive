[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "E741", "SIM105", "SIM108", "SIM115", "SIM117", "B027", "UP017", "E702", "E402", "C408"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets tests/mediasync/test_downloader.py coexist with the
# top-level tests/test_downloader.py without turning tests/ into a package
# (which would shadow src/mediasync).
# Coverage settings live here (not in the CI workflow) so that a local run and
# a CI run enforce exactly the same threshold. Pass --no-cov to skip.
addopts = "--import-mode=importlib --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/__pycache__/*",
    "src/export_cookies.py",
    # Thin `python -m mediasync` shim: three lines that only call cli.main().
    "src/mediasync/__main__.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
