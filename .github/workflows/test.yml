name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      # `ruff check` only. `ruff format` is deliberately not gated yet: it would
      # rewrite 39 files, and that churn does not belong in a behaviour-
      # preserving refactor. Adopt it as a separate, isolated commit.
      - name: Check lint
        run: ruff check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: us-east-1
        # Coverage source, omissions and the 95% threshold come from
        # pyproject.toml so this run is identical to a local one.
        run: python -m pytest tests/ --tb=short

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  # NOTE: End-to-end tests (eval/run_e2e_tests.sh) are intentionally NOT run in CI.
  # They require AWS credentials (Bedrock + optionally Transcribe), cost ~$0.50–$2.00
  # per run, and take 5–30 minutes. Run them manually before shipping:
  #   ./eval/run_e2e_tests.sh                  # fast tier (cached transcript)
  #   ./eval/run_e2e_tests.sh --full            # full pipeline
  # See README.md § "End-to-End Regression Tests" for full instructions.

  # Single stable check used as the required GitHub branch-protection status.
  # Add "ci-gate" as the required status check in your branch protection rules.
  # This job only passes when ALL matrix jobs above pass.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed (result: ${{ needs.lint.result }})"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ One or more test matrix jobs failed (result: ${{ needs.test.result }})"
            exit 1
          fi
          echo "✅ Lint and all test matrix jobs passed"
