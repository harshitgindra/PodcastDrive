name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=95

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  # Single stable check used as the required GitHub branch-protection status.
  # Add "ci-gate" as the required status check in your branch protection rules.
  # This job only passes when ALL matrix jobs above pass.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check all matrix jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ One or more test matrix jobs failed (result: ${{ needs.test.result }})"
            exit 1
          fi
          echo "✅ All test matrix jobs passed"
